[package]
name = "blocktrace"
version = "0.1.0"
edition = "2024"
description = "Normalize memory traces into cache-block traces with forward references"
license = "MIT"
repository = "https://github.com/WuInTime/blocktrace"

[dependencies]
bitvec = "1.0.1"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1.2"
xz2 = "0.1.7"
zstd = "0.13.3"
